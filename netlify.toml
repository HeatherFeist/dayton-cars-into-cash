[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Yard subdomains are rewritten to /_aff/<yard>/ by the edge function.
# This fallback only covers unknown paths on the city directory.
[[edge_functions]]
  function = "affiliate-router"
  path = "/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
